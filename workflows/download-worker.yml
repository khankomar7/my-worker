name: Download Worker

on:
  workflow_dispatch:
    inputs:
      worker_name:
        description: "Worker name"
        required: true

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download worker script
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          WORKER_NAME: ${{ inputs.worker_name }}
        run: |
          curl -s -D headers.txt \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/$WORKER_NAME" \
            -o raw.txt

          # اگه خروجی multipart بود، بخش اصلی کد رو جدا کن
          if grep -q '^--' raw.txt; then
            BOUNDARY=$(head -n 1 raw.txt | tr -d '\r')
            awk -v b="$BOUNDARY" '
              $0 ~ "^"b { part++; hdr=1; next }
              part==1 && hdr && /^\r?$/ { hdr=0; next }
              part==1 && !hdr { print }
            ' raw.txt > worker.js
          else
            mv raw.txt worker.js
          fi

          rm -f raw.txt headers.txt
          echo "---- first lines ----"
          head -n 5 worker.js

      - name: Commit worker.js
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add worker.js
          git commit -m "Add worker.js from Cloudflare" || echo "no changes"
          git push
